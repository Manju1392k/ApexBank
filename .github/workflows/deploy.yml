name: Build and Deploy ApexBank

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Roll out to the server after building"
        type: boolean
        default: true

permissions:
  id-token: write      # required for OIDC
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: apexbank
  ASG_NAME: apexbank-asg-nvir
  PARAM_PREFIX: /apexbank/prod

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apexbankdb
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SECURE_SSL_REDIRECT: "false"
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: apexbankdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push image (skip if this commit was already pushed)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already exists, skipping build."
          else
            docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" .
            docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          fi

      - name: Record the image tag the server should run
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: aws ssm put-parameter --name "$PARAM_PREFIX/image_tag" --type String --value "$TAG" --overwrite

  deploy:
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run database migrations on the server
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=apexbank" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$INSTANCE_ID" = "None" ]; then echo "No running instance found"; exit 1; fi
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/apexbank/deploy.sh migrate"]' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"

      - name: Replace the server (new one starts and turns healthy before the old one stops)
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":120}'
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --query "InstanceRefreshes[0].Status" --output text)
            echo "Instance refresh status: $STATUS"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed) exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for instance refresh"; exit 1